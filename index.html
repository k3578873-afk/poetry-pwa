    <!DOCTYPE html>
<html lang="ru">
<head>

  <style>
    :root{color-scheme:dark;--bg:#071426;--paper:#0d2039;--paper-deep:#142b48;--ink:#f7f8fc;--muted:#b7c5d9;--line:#2a4260;--gold:#e1eaf7;--gold-soft:#ffffff;--forest:#eaf1fb;--shadow:0 14px 36px rgba(3,9,17,.38)}
    :root[data-theme="light"]{color-scheme:light;--bg:#f5f2eb;--paper:#fffdf8;--paper-deep:#e9e4d9;--ink:#102541;--muted:#56667a;--line:#d5dce5;--gold:#173452;--gold-soft:#102541;--forest:#102541;--shadow:0 12px 28px rgba(23,52,82,.12)}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#050f1f;--paper:#0b1c32;--paper-deep:#132945;--ink:#ffffff;--muted:#b7c5d9;--line:#263e5c;--gold:#e5edf9;--gold-soft:#ffffff;--forest:#eaf1fb;--shadow:0 14px 36px rgba(3,9,17,.38)}
    :root[data-theme="light"] .brand-logo{filter:brightness(0) saturate(100%) invert(12%) sepia(24%) saturate(1372%) hue-rotate(176deg) brightness(92%) contrast(94%)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent} body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;transition:background .2s ease,color .2s ease}
    button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}
    header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:0;position:relative;min-width:0;flex:0 1 auto}.brand-logo{display:block;width:clamp(118px,36vw,164px);max-height:88px;height:auto;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18))}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.header-count{font-size:13px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums;min-width:20px;text-align:center}.icon-btn{width:44px;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .2s ease,border-color .2s ease,background .2s ease}.icon-btn:hover{transform:translateY(-1px);border-color:var(--gold)}
    .btn-quiet,.btn-add{border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:transform .2s ease,border-color .2s ease,background .2s ease}.btn-add{background:linear-gradient(180deg,var(--paper-deep),var(--paper));border-color:var(--gold);color:var(--gold-soft)}.btn-quiet:hover,.btn-add:hover{transform:translateY(-1px)}
    main{max-width:760px;margin:0 auto;padding:16px 20px 56px}.collection-head{padding:18px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.headline{font-size:clamp(28px,5vw,40px);line-height:1.05}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.search-bar{position:relative}.search-bar input,.control,.modal-content input,.modal-content textarea,.modal-content select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);outline:none}.search-bar input:focus,.control:focus,.modal-content input:focus,.modal-content textarea:focus,.modal-content select:focus{border-color:var(--gold)}
    .filter-btn.active{border-color:var(--gold);color:var(--gold)}
    .quote-shelf{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:14px 16px;margin-bottom:18px;scroll-behavior:smooth}.quote-track{position:relative}.quote-slide{display:flex;align-items:center;justify-content:center;min-height:88px;padding:10px 6px}.quote-text{font-family:var(--serif);font-size:clamp(1.15rem,2.8vw,1.45rem);font-style:italic;line-height:1.5;color:var(--gold);text-align:center;max-width:100%;word-break:break-word}.quote-meta{display:flex;justify-content:center}.quote-micro{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);opacity:.8}
    #poemsGrid{display:grid;gap:16px}.poem-card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:23px 21px 22px 25px;cursor:pointer;box-shadow:var(--shadow)}.poem-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.card-top h3{font-size:clamp(1.3rem,2vw,1.6rem);font-weight:700;line-height:1.2}.date{font-size:12px;color:var(--muted);margin-top:6px}.star-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.star-btn.active{background:rgba(255,204,102,.08);border-color:var(--gold);color:var(--gold)}.preview{font-size:15px;line-height:1.7;color:var(--ink);max-height:6.8em;overflow:hidden;white-space:pre-wrap;word-break:break-word}.category-pill{display:inline-block;margin-top:14px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--gold);font-size:12px;background:rgba(255,255,255,.02)}
    #adminPanel{display:none}.modal{display:none;position:fixed;inset:0;background:rgba(8,13,11,.58);backdrop-filter:blur(5px);z-index:60;align-items:center;justify-content:center;padding:14px}.modal.active{display:flex}.modal-content{width:min(100%,560px);background:var(--paper-deep);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}.modal-content h2{margin-bottom:16px}.modal-content label{display:block;margin:10px 0 8px;color:var(--muted);font-size:14px}.modal-content textarea{min-height:180px;resize:vertical}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.actions-right{display:flex;align-items:center;gap:8px;margin-left:auto}.drawer-backdrop{position:fixed;inset:0;background:rgba(5,10,8,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}.drawer-backdrop.open{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(90vw,360px);background:var(--paper-deep);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .24s ease;z-index:90;padding:18px 16px;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer-head h2{font-size:28px}.drawer-section{padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:14px}.drawer-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:8px 0 10px}.drawer-action{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);color:var(--ink);margin-bottom:10px}.hidden{display:none!important}.sync-line{font-size:12px;color:var(--muted);margin:8px 0 16px}.empty-state{padding:26px 16px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);background:rgba(255,255,255,.02)}.quote-library{display:grid;gap:12px;max-height:50vh;overflow:auto}.quote-item{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.quote-item p{white-space:pre-wrap;word-break:break-word;line-height:1.5}.quote-item-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.view-meta{font-size:12px;color:var(--muted);margin-bottom:12px}.view-text{white-space:pre-wrap;word-break:break-word;line-height:1.9;font-size:21px}.reader-tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.reader-mode body{background:#f3efe7;color:#170f0a}.reader-mode .modal-content{background:#f8f5ee;border-color:#d7cdbd}.reader-mode .view-text{color:#1d1209}.reader-mode .btn-quiet,.reader-mode .btn-add,.reader-mode .icon-btn,.reader-mode .drawer-action,.reader-mode .control,.reader-mode .search-bar input{background:#f5efe7;color:#22150d;border-color:#d7cdbd}.reader-mode .brand-logo{filter:brightness(0) saturate(100%) invert(12%) sepia(24%) saturate(1372%) hue-rotate(176deg) brightness(92%) contrast(94%)}
    @media(max-width:480px){header{padding:12px 14px}.brand-logo{width:clamp(112px,34vw,138px);max-height:78px}.header-actions{gap:6px}.icon-btn{width:40px;height:40px}.btn-add,.btn-quiet{padding:9px 12px}.toolbar{grid-template-columns:1fr}.main{padding:14px 14px 48px}.poem-card{padding:18px 16px}.quote-text{font-size:1.05rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><img class="brand-logo" src="logo-feather.png" alt="Моя Поэзия"></div>
    <div class="header-actions">
      <span id="poemCount" class="header-count" title="Количество стихотворений">0</span><button id="themeBtn" class="icon-btn" onclick="toggleTheme()" aria-label="Переключить тему">☼</button>
      <button id="menuBtn" class="icon-btn" onclick="toggleMenu(true)" aria-label="Открыть меню" title="Меню">☰</button>
      <button id="loginBtn" class="btn-quiet" onclick="login()">Войти</button>
      <button id="logoutBtn" class="btn-quiet hidden" onclick="logout()">Выйти</button>
      <button id="addBtn" class="btn-add hidden" onclick="openEditModal()">+ Стих</button>
    </div>
  </header>
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="toggleMenu(false)"></div>
  <aside id="appDrawer" class="drawer" aria-label="Главное меню" aria-hidden="true">
    <div class="drawer-head"><h2>Моя Поэзия</h2><button class="icon-btn" onclick="toggleMenu(false)" aria-label="Закрыть меню">×</button></div>
    <div class="drawer-section"><div class="drawer-label">Библиотека</div>
      <button class="drawer-action" onclick="toggleMenu(false);openQuoteList()">☷ Список цитат</button>
      <button class="drawer-action" onclick="toggleMenu(false);toggleFavoritesFilter()">☆ Избранное</button>
      <button class="drawer-action" onclick="toggleMenu(false);clearFilters()">↺ Сбросить фильтры</button>
      <label class="drawer-label" for="categoryFilter">Категория</label><select class="control" id="categoryFilter" aria-label="Фильтр по категории" onchange="scheduleRender()"><option value="">Все категории</option></select>
      <label class="drawer-label" for="sortSelect">Сортировка</label><select class="control" id="sortSelect" aria-label="Сортировка" onchange="scheduleRender()"><option value="newest">Сначала новые</option><option value="oldest">Сначала старые</option><option value="title">По названию</option></select>
    </div>
    <section id="adminPanel" class="drawer-section">
      <div class="drawer-label">Инструменты администратора</div><p class="admin-caption">Режим администратора · <span id="adminUid"></span></p>
      <button class="drawer-action" onclick="toggleMenu(false);importLocal()">Перенести старые стихи</button>
      <button class="drawer-action" onclick="toggleMenu(false);exportBackup()">Экспорт / резервная копия</button>
      <button class="drawer-action" onclick="toggleMenu(false);document.getElementById('backupFile').click()">Восстановить из JSON</button>
      <input class="hidden" type="file" id="backupFile" accept="application/json,.json" onchange="importBackup(event)">
    </section>
    <div class="drawer-section"><div class="drawer-label">Аккаунт и оформление</div>
      <button class="drawer-action" onclick="toggleMenu(false);toggleTheme()">☼ Переключить светлую / тёмную тему</button>
      <button id="drawerLoginBtn" class="drawer-action" onclick="toggleMenu(false);login()">Войти через Google</button>
      <button id="drawerLogoutBtn" class="drawer-action hidden" onclick="toggleMenu(false);logout()">Выйти из аккаунта</button>
    </div>
  </aside>
  <main>
    <div class="toolbar">
      <div class="search-bar"><input type="search" id="searchInput" placeholder="Найти стихотворение…" aria-label="Поиск стихов"></div>
      <button id="favoritesFilter" class="btn-quiet filter-btn" onclick="toggleFavoritesFilter()">☆ Избранное</button>
    </div>
    <section class="quote-shelf" id="quoteShelf" aria-label="Цитаты — прокручивай вверх или вниз" tabindex="0">
      <div class="quote-track" id="quoteTrack"><article class="quote-slide"><div class="quote-text">Твои мысли заслуживают собственной страницы.</div></article></div>
    </section>
    <div id="syncStatus" class="sync-line hidden" role="status" aria-live="polite">Подключение к библиотеке…</div>
    <div id="poemsGrid"></div>
  </main>

  <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <h2 id="modalTitle" style="color:var(--accent-gold);font-family:var(--font-serif)">Новый стих</h2>
      <input type="hidden" id="poemId">
      <label for="titleInput">Название</label><input id="titleInput" type="text" maxlength="180" placeholder="Название стихотворения">
      <label for="categoryInput">Категория</label><input id="categoryInput" type="text" maxlength="60" list="categorySuggestions" placeholder="Например: Любовь, Жизнь, Грусть">
      <datalist id="categorySuggestions"><option value="Любовь"><option value="Жизнь"><option value="Грусть"><option value="Вдохновение"><option value="Природа"></datalist>
      <label for="bodyInput">Текст стихотворения</label><textarea id="bodyInput" placeholder="Текст стихотворения…"></textarea>
      <div class="actions">
        <button id="deleteBtn" onclick="removePoem()" style="background:transparent;color:#ef4444;border:none;display:none">Удалить</button>
        <div class="actions-right"><button class="btn-quiet" onclick="closeModal('editModal')">Отмена</button><button class="btn-add" onclick="save()">Сохранить</button></div>
      </div>
    </div>
  </div>

  <div class="modal" id="viewModal" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
    <div class="modal-content" id="readerContent">
      <h2 id="viewTitle" style="color:var(--accent-gold);font-family:var(--font-serif)"></h2>
      <div id="viewDate" class="view-meta"></div>
      <div id="viewCategory" class="category-pill hidden"></div>
      <div id="viewBody" class="view-text"></div>
      <div class="reader-tools">
        <button id="viewFavoriteBtn" class="btn-quiet" onclick="toggleCurrentFavorite()">☆ В избранное</button>
        <button id="readerModeBtn" class="btn-quiet" onclick="toggleReaderMode()">✧ Режим чтения</button>
        <button class="btn-quiet" onclick="changeReaderSize(-1)" aria-label="Уменьшить текст">A−</button>
        <button class="btn-quiet" onclick="changeReaderSize(1)" aria-label="Увеличить текст">A+</button>
      </div>
      <div class="actions">
        <button class="btn-quiet" onclick="closeModal('viewModal')">Закрыть</button>
        <button id="editCurrentBtn" onclick="editCurrent()" class="btn-add hidden">Изменить</button>
      </div>
    </div>
  </div>

  <div class="modal" id="quoteListModal" role="dialog" aria-modal="true" aria-labelledby="quoteListTitle">
    <div class="modal-content">
      <div class="card-top"><h2 id="quoteListTitle" style="font-family:var(--serif);font-size:30px;color:var(--gold)">Список цитат</h2><button class="icon-btn" onclick="closeModal('quoteListModal')" aria-label="Закрыть список цитат">×</button></div>
      <p class="admin-caption" style="margin:8px 0 14px">Все сохранённые цитаты. Здесь их можно редактировать или удалять.</p>
      <div id="quoteLibrary" class="quote-library"></div>
      <div class="actions"><button class="btn-quiet" onclick="closeModal('quoteListModal')">Закрыть</button><button class="btn-add" onclick="openQuoteEditor()">+ Новая цитата</button></div>
    </div>
  </div>

  <div class="modal" id="quoteModal" role="dialog" aria-modal="true" aria-labelledby="quoteModalTitle">
    <div class="modal-content"><h2 id="quoteModalTitle" style="font-family:var(--serif);font-size:30px;color:var(--gold)">Новая цитата</h2>
      <input type="hidden" id="quoteId"><label for="quoteInput">Твоя цитата</label><textarea id="quoteInput" maxlength="1200" placeholder="Запиши мысль, к которой хочется возвращаться."></textarea>
      <div class="actions"><button id="deleteQuoteBtn" class="btn-quiet" style="color:#b94b43;display:none" onclick="deleteQuote()">Удалить</button><div class="actions-right"><button class="btn-quiet" onclick="closeModal('quoteModal')">Отмена</button><button class="btn-add" onclick="saveQuote()">Сохранить</button></div></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyBjcUXcG0MfND7G14UoGVYH8G1xuaeZoPg',
      authDomain: 'marufs-poetry.firebaseapp.com',
      projectId: 'marufs-poetry',
      storageBucket: 'marufs-poetry.firebasestorage.app',
      messagingSenderId: '213962256080',
      appId: '1:213962256080:web:39afdd3835e6d6201238d5',
      measurementId: 'G-JLQ7NYL03C'
    };
    const ADMIN_UID = 'GgKTFgrTyKUUtxZwL8QEy4BlCRs1';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const poemsRef = collection(db, 'poems');
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    let poems = [], favorites = new Set(), currentActiveId = null, admin = false, currentUser = null;
    let favoritesUnsubscribe = null, poemsUnsubscribe = null, quotesUnsubscribe = null, quoteFavoritesUnsubscribe = null, favoritesOnly = false, readerFontSize = 21;
    let quotes = [], quoteIndex = 0, quoteTimer = null, quoteTouchX = null, quoteFavorites = new Set();
    let renderQueued = false;
    let searchDebounce = null;
    const poemGrid = $('poemsGrid');
    const searchInput = $('searchInput');
    const status = message => { $('syncStatus').textContent = message; };
    const favoriteRef = (uid, poemId) => doc(db, 'users', uid, 'favorites', poemId);
    const quoteCollection = uid => collection(db, 'users', uid, 'quotes');

    const THEME_KEY = 'moja-poeziya-theme';
    function applyTheme(theme) { document.documentElement.dataset.theme = theme; $('themeBtn').textContent = theme === 'dark' ? '☼' : '☾'; $('themeBtn').setAttribute('aria-label', theme === 'dark' ? 'Переключить на светлую тему' : 'Переключить на тёмную тему'); }
    window.toggleTheme = function() { const next=document.documentElement.dataset.theme==='dark'?'light':'dark'; localStorage.setItem(THEME_KEY,next); applyTheme(next); };
    window.toggleMenu = function(open) { const drawer=$('appDrawer'), backdrop=$('drawerBackdrop'); drawer.classList.toggle('open',open); backdrop.classList.toggle('open',open); drawer.setAttribute('aria-hidden', String(!open)); };
    applyTheme(localStorage.getItem(THEME_KEY)==='light'?'light':'dark');
    window.openQuoteList = function(){
      if(!currentUser){alert('Войди через Google, чтобы просматривать и изменять свои цитаты.');return;}
      renderQuoteLibrary(); $('quoteListModal').classList.add('active');
    };
    function renderQuoteLibrary(){
      const host=$('quoteLibrary'); if(!host) return;
      if(!currentUser){host.innerHTML='<p class="admin-caption">Войди через Google, чтобы управлять цитатами.</p>';return;}
      if(!quotes.length){host.innerHTML='<p class="empty-state">Цитат пока нет. Нажми «Новая цитата», чтобы добавить первую.</p>';return;}
      host.innerHTML=quotes.map((q,i)=>`<div class="quote-item"><p>${escapeHtml(q.text)}</p><div class="quote-item-actions"><button onclick="openQuoteEditor('${escapeHtml(q.id)}')">✎ Изменить</button><button onclick="deleteQuoteById('${escapeHtml(q.id)}')">Удалить</button></div></div>`).join('');
    }
    window.showQuote=id=>{const i=quotes.findIndex(q=>q.id===id);if(i>=0){quoteIndex=i;renderQuote();closeModal('quoteListModal');toggleMenu(false);$('quoteShelf').scrollIntoView({behavior:'smooth',block:'nearest'});}}
    window.deleteQuoteById=async id=>{if(!currentUser||!id||!confirm('Удалить эту цитату?'))return;try{await deleteDoc(doc(db,'users',currentUser.uid,'quotes',id));}catch(e){alert('Не удалось удалить цитату: '+e.message);}}
    function fitQuoteShelf(index=quoteIndex){
      const shelf=$('quoteShelf'), track=$('quoteTrack'); if(!shelf||!track||!track.children.length)return;
      const slide=track.children[Math.max(0,Math.min(index,track.children.length-1))];
      if(!slide)return;
      const max=Math.max(150,Math.floor(window.innerHeight*.42));
      shelf.style.height=Math.min(slide.scrollHeight,max)+'px';
    }
    let quoteProgrammaticScroll=false;
    function scrollQuoteTo(index,smooth=true){
      const shelf=$('quoteShelf'),track=$('quoteTrack');
      if(!shelf||!track||!track.children.length)return;
      const count=quotes.length;
      const visualIndex=count ? count + ((index % count) + count) % count : 0;
      const slide=track.children[visualIndex];
      if(!slide)return;
      fitQuoteShelf(visualIndex);
      quoteProgrammaticScroll=true;
      shelf.scrollTo({top:slide.offsetTop,behavior:smooth?'smooth':'auto'});
      if(quoteProgrammaticReset)clearTimeout(quoteProgrammaticReset);
      quoteProgrammaticReset=setTimeout(()=>{quoteProgrammaticScroll=false;},700);
    }
    let quoteProgrammaticReset=null;
    function renderQuote(){

      poems=snapshot.docs.map(d=>({id:d.id,...d.data()})); refreshCategoryFilter(); scheduleRender();
      status(snapshot.metadata.fromCache?'Офлайн: показана сохранённая копия':'Библиотека синхронизирована с Firebase');
    },error=>{ console.error(error); status('Ошибка загрузки стихов: '+error.message+'. Проверь Firestore Rules и подключение.'); });

    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(scheduleRender, 120);
    });

    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.error('Service Worker:',err)));
  </script>
</body>
</html>
