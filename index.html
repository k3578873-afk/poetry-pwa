<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maruf's Poetry</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f141d">
    
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f141d;
            --card-bg: #1a212d;
            --card-border: #2a3447;
            --accent-gold: #e2b765;
            --text-primary: #e6e8ec;
            --text-secondary: #94a3b8;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 20, 29, 0.9);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand h1 {
            font-family: var(--font-serif);
            font-size: 26px;
            color: var(--accent-gold);
        }

        .btn-add {
            background: linear-gradient(135deg, #e2b765, #c59b48);
            color: #0f141d;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        main { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }

        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-primary);
            outline: none;
            margin-bottom: 20px;
        }

        .poem-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            border-left: 3px solid var(--accent-gold);
            transition: transform 0.1s ease;
        }

        .poem-card:active { transform: scale(0.98); }

        .poem-card h3 { font-family: var(--font-serif); font-size: 22px; color: var(--text-primary); }
        .poem-card .date { font-size: 12px; color: var(--text-secondary); margin: 4px 0 10px; }
        .poem-card .preview {
            font-family: var(--font-serif);
            font-size: 16px; color: #cbd5e1;
            white-space: pre-line;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 22, 0.85); backdrop-filter: blur(8px);
            z-index: 200; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; width: 100%; max-width: 500px; padding: 20px;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-content input, .modal-content textarea {
            width: 100%; background: #0f141d; border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px; color: #fff; margin-top: 8px; outline: none;
        }
        .modal-content textarea { font-family: var(--font-serif); font-size: 18px; height: 200px; line-height: 1.5; }
        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .view-text { font-family: var(--font-serif); font-size: 19px; line-height: 1.6; white-space: pre-wrap; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Maruf's Poetry</h1>
        </div>
        <button class="btn-add" onclick="openEditModal()">+ Стих</button>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Поиск стихов..." oninput="render()">
        </div>
        <div id="poemsGrid"></div>
    </main>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color:var(--accent-gold); font-family:var(--font-serif);">Новый стих</h2>
            <input type="hidden" id="poemId">
            <input type="text" id="titleInput" placeholder="Название">
            <textarea id="bodyInput" placeholder="Текст стихотворения..."></textarea>
            <div class="actions">
                <button id="deleteBtn" onclick="removePoem()" style="background:transparent; color:#ef4444; border:none; cursor:pointer; display:none;">Удалить</button>
                <div style="margin-left:auto; display:flex; gap:10px;">
                    <button onclick="closeModal('editModal')" style="background:transparent; color:#aaa; border:none; cursor:pointer;">Отмена</button>
                    <button onclick="save()" class="btn-add">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="viewModal">
        <div class="modal-content">
            <h2 id="viewTitle" style="color:var(--accent-gold); font-family:var(--font-serif);"></h2>
            <div id="viewDate" style="font-size:12px; color:var(--text-secondary); margin-top:4px;"></div>
            <div id="viewBody" class="view-text"></div>
            <div class="actions" style="margin-top:20px;">
                <button onclick="closeModal('viewModal')" style="background:transparent; color:#aaa; border:none; cursor:pointer;">Закрыть</button>
                <button onclick="editCurrent()" class="btn-add">Изменить</button>
            </div>
        </div>
    </div>

    <script>
        let poems = JSON.parse(localStorage.getItem('my_poems') || '[]');
        let currentActiveId = null;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function render() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const grid = document.getElementById('poemsGrid');
            
            const filtered = poems.filter(p => 
                p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q)
            );

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#666; margin-top:40px;">Записи не найдены</p>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="poem-card" onclick="viewPoem(${p.id})">
                    <h3>${escapeHtml(p.title)}</h3>
                    <div class="date">${p.date}</div>
                    <div class="preview">${escapeHtml(p.body)}</div>
                </div>
            `).join('');
        }

        function openEditModal(id = null) {
            currentActiveId = id;
            if (id) {
                const p = poems.find(x => x.id == id);
                document.getElementById('poemId').value = p.id;
                document.getElementById('titleInput').value = p.title;
                document.getElementById('bodyInput').value = p.body;
                document.getElementById('modalTitle').innerText = 'Редактировать';
                document.getElementById('deleteBtn').style.display = 'block';
            } else {
                document.getElementById('poemId').value = '';
                document.getElementById('titleInput').value = '';
                document.getElementById('bodyInput').value = '';
                document.getElementById('modalTitle').innerText = 'Новый стих';
                document.getElementById('deleteBtn').style.display = 'none';
            }
            closeModal('viewModal');
            document.getElementById('editModal').classList.add('active');
        }

        function viewPoem(id) {
            currentActiveId = id;
            const p = poems.find(x => x.id == id);
            if (!p) return;

            document.getElementById('viewTitle').innerText = p.title;
            document.getElementById('viewDate').innerText = p.date;
            document.getElementById('viewBody').innerText = p.body;
            document.getElementById('viewModal').classList.add('active');
        }

        function editCurrent() {
            if (currentActiveId) openEditModal(currentActiveId);
        }

        function closeModal(modalId) { 
            document.getElementById(modalId).classList.remove('active'); 
        }

        function save() {
            const id = document.getElementById('poemId').value;
            const title = document.getElementById('titleInput').value.trim() || 'Без названия';
            const body = document.getElementById('bodyInput').value.trim();
            if (!body) return;

            if (id) {
                const p = poems.find(x => x.id == id);
                if (p) { p.title = title; p.body = body; }
            } else {
                poems.unshift({ id: Date.now(), title, body, date: new Date().toLocaleDateString('ru-RU') });
            }
            
            localStorage.setItem('my_poems', JSON.stringify(poems));
            closeModal('editModal');
            render();
        }

        function removePoem() {
            if (confirm('Удалить этот стих?')) {
                poems = poems.filter(x => x.id != currentActiveId);
                localStorage.setItem('my_poems', JSON.stringify(poems));
                closeModal('editModal');
                render();
            }
        }

        render();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
