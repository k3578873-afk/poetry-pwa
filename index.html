<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Поэтический Альбом</title>
    
    <!-- PWA: Ссылка на манифест и цвет темы -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f141d">
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f141d;
            --card-bg: #1a212d;
            --card-border: #2a3447;
            --accent-gold: #e2b765;
            --text-primary: #e6e8ec;
            --text-secondary: #94a3b8;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 20, 29, 0.9);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand h1 {
            font-family: var(--font-serif);
            font-size: 26px;
            color: var(--accent-gold);
        }

        .btn-add {
            background: linear-gradient(135deg, #e2b765, #c59b48);
            color: #0f141d;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        main { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }

        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-primary);
            outline: none;
            margin-bottom: 20px;
        }

        .poem-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            border-left: 3px solid var(--accent-gold);
            transition: transform 0.1s ease;
        }

        .poem-card:active { transform: scale(0.98); }

        .poem-card h3 { font-family: var(--font-serif); font-size: 22px; color: var(--text-primary); }
        .poem-card .date { font-size: 12px; color: var(--text-secondary); margin: 4px 0 10px; }
        .poem-card .preview {
            font-family: var(--font-serif);
            font-size: 16px; color: #cbd5e1;
            white-space: pre-line;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 22, 0.85); backdrop-filter: blur(8px);
            z-index: 200; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; width: 100%; max-width: 500px; padding: 20px;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-content input, .modal-content textarea {
            width: 100%; background: #0f141d; border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px; color: #fff; margin-top: 8px; outline: none;
        }
        .modal-content textarea { font-family: var(--font-serif); font-size: 18px; height: 200px; line-height: 1.5; }
        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .view-text { font-family: var(--font-serif); font-size: 19px; line-height: 1.6; white-space: pre-wrap; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Моя Поэзия</h1>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button id="loginBtn" class="btn-add" onclick="login()">Войти через Google</button><button id="logoutBtn" class="btn-add" style="display:none" onclick="logout()">Выйти</button><button id="addBtn" class="btn-add" style="display:none" onclick="openEditModal()">+ Стих</button></div>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Поиск стихов..." oninput="render()">
        </div>
        <div id="syncStatus" style="color:var(--text-secondary);font-size:12px;margin-bottom:12px">Подключение к библиотеке…</div><div id="adminPanel" style="display:none;margin-bottom:15px"><p style="font-size:12px;color:var(--text-secondary)">Администратор: <span id="adminUid"></span></p><button class="btn-add" onclick="importLocal()">Перенести локальные стихи в облако</button></div><div id="poemsGrid"></div>
    </main>

    <!-- Модалка Создания / Редактирования -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color:var(--accent-gold); font-family:var(--font-serif);">Новый стих</h2>
            <input type="hidden" id="poemId">
            <input type="text" id="titleInput" placeholder="Название">
            <textarea id="bodyInput" placeholder="Текст стихотворения..."></textarea>
            <div class="actions">
                <button id="deleteBtn" onclick="removePoem()" style="background:transparent; color:#ef4444; border:none; cursor:pointer; display:none;">Удалить</button>
                <div style="margin-left:auto; display:flex; gap:10px;">
                    <button onclick="closeModal('editModal')" style="background:transparent; color:#aaa; border:none; cursor:pointer;">Отмена</button>
                    <button onclick="save()" class="btn-add">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка Просмотра -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <h2 id="viewTitle" style="color:var(--accent-gold); font-family:var(--font-serif);"></h2>
            <div id="viewDate" style="font-size:12px; color:var(--text-secondary); margin-top:4px;"></div>
            <div id="viewBody" class="view-text"></div>
            <div class="actions" style="margin-top:20px;">
                <button onclick="closeModal('viewModal')" style="background:transparent; color:#aaa; border:none; cursor:pointer;">Закрыть</button>
                <button id="editCurrentBtn" onclick="editCurrent()" class="btn-add" style="display:none">Изменить</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, enableIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyBjcUXcG0MfND7G14UoGVYH8G1xuaeZoPg',
            authDomain: 'marufs-poetry.firebaseapp.com',
            projectId: 'marufs-poetry',
            storageBucket: 'marufs-poetry.firebasestorage.app',
            messagingSenderId: '213962256080',
            appId: '1:213962256080:web:39afdd3835e6d6201238d5',
            measurementId: 'G-JLQ7NYL03C'
        };
        // После первого входа вставьте UID администратора сюда.
        // UID также должен совпадать с UID в firestore.rules.
        const ADMIN_UID = 'REPLACE_WITH_YOUR_FIREBASE_UID';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const poemsRef = collection(db, 'poems');
        let poems = [];
        let currentActiveId = null;
        let admin = false;
        let loaded = false;
        const $ = id => document.getElementById(id);
        const status = message => { $('syncStatus').textContent = message; };
        const escapeHtml = str => String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

        function render() {
            const q = $('searchInput').value.trim().toLowerCase();
            const filtered = poems.filter(p => (p.title||'').toLowerCase().includes(q) || (p.body||'').toLowerCase().includes(q));
            $('poemsGrid').innerHTML = filtered.length ? filtered.map(p => `
                <div class="poem-card" data-poem-id="${escapeHtml(p.id)}">
                    <h3>${escapeHtml(p.title)}</h3>
                    <div class="date">${escapeHtml(p.date||'')}</div>
                    <div class="preview">${escapeHtml(p.body)}</div>
                </div>`).join('') : '<p style="text-align:center;color:#666;margin-top:40px">Стихи не найдены</p>';
        }
        $('poemsGrid').addEventListener('click', event => {
            const card = event.target.closest('[data-poem-id]');
            if (card) viewPoem(card.dataset.poemId);
        });
        window.render = render;
        window.openEditModal = function(id=null) {
            if (!admin) return;
            currentActiveId = id;
            const p = id ? poems.find(x => x.id === id) : null;
            $('poemId').value = p?.id || '';
            $('titleInput').value = p?.title || '';
            $('bodyInput').value = p?.body || '';
            $('modalTitle').innerText = p ? 'Редактировать' : 'Новый стих';
            $('deleteBtn').style.display = p ? 'block' : 'none';
            closeModal('viewModal');
            $('editModal').classList.add('active');
        };
        function viewPoem(id) {
            const p = poems.find(x => x.id === id);
            if (!p) return;
            currentActiveId = id;
            $('viewTitle').innerText = p.title;
            $('viewDate').innerText = p.date||'';
            $('viewBody').innerText = p.body;
            $('viewModal').classList.add('active');
        }
        window.editCurrent = () => { if (admin && currentActiveId) openEditModal(currentActiveId); };
        window.closeModal = id => $(id).classList.remove('active');
        window.save = async function() {
            if (!admin) return;
            const id = $('poemId').value || crypto.randomUUID();
            const title = $('titleInput').value.trim() || 'Без названия';
            const body = $('bodyInput').value.trim();
            if (!body) return alert('Введите текст стихотворения');
            const previous = poems.find(p => p.id === id);
            try {
                await setDoc(doc(db,'poems',id), { title,body,date:previous?.date || new Date().toLocaleDateString('ru-RU'),updatedAt:Date.now() });
                closeModal('editModal');
            } catch(e) { alert('Не удалось сохранить стих: '+e.message); }
        };
        window.removePoem = async function() {
            if (!admin || !currentActiveId || !confirm('Удалить этот стих?')) return;
            try { await deleteDoc(doc(db,'poems',currentActiveId)); closeModal('editModal'); }
            catch(e) { alert('Не удалось удалить стих: '+e.message); }
        };
        window.importLocal = async function() {
            if (!admin) return;
            let local;
            try { local=JSON.parse(localStorage.getItem('my_poems')||'[]'); } catch { return alert('Ошибка чтения локальных стихов'); }
            if (!Array.isArray(local) || !local.length) return alert('На этом устройстве нет локальных стихов');
            if (!confirm(`Перенести ${local.length} локальных стихов в облако? Старые данные останутся на устройстве.`)) return;
            let count=0;
            for(const p of local) {
                if (!p || typeof p.body !== 'string') continue;
                const id='legacy-'+String(p.id ?? crypto.randomUUID()).replace(/[^a-zA-Z0-9_-]/g,'_');
                try { await setDoc(doc(db,'poems',id), {title:String(p.title||'Без названия'),body:p.body,date:String(p.date||''),updatedAt:Date.now()});count++; }
                catch(e) { alert(`Перенесено ${count}. Ошибка: ${e.message}`);return; }
            }
            alert(`Перенесено стихов: ${count}. Локальные копии сохранены.`);
        };
        window.login = async function() {
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth,provider); }
            catch(e) {
                if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
                    try { await signInWithRedirect(auth,provider); } catch(err) { alert('Ошибка входа: '+err.message); }
                } else alert('Ошибка входа: '+e.message);
            }
        };
        window.logout = () => signOut(auth);
        getRedirectResult(auth).catch(e => console.warn('Google redirect:',e));
        onAuthStateChanged(auth,user => {
            admin = !!user && user.uid === ADMIN_UID;
            $('loginBtn').style.display = user ? 'none' : '';
            $('logoutBtn').style.display = user ? '' : 'none';
            $('addBtn').style.display = admin ? '' : 'none';
            $('editCurrentBtn').style.display = admin ? '' : 'none';
            $('adminPanel').style.display = admin ? '' : 'none';
            if (user) {
                $('adminUid').textContent = user.uid;
                if (!admin) status('Вход выполнен. Ваш UID: '+user.uid+' (права администратора ещё не настроены).');
            }
        });
        onSnapshot(poemsRef,snapshot => {
            poems = snapshot.docs.map(d => ({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
            loaded=true;
            status(snapshot.metadata.fromCache ? 'Офлайн: показана сохранённая копия' : 'Общая библиотека синхронизирована');
            render();
        },error => { status('Ошибка загрузки: '+error.message+'. Проверьте правила Firestore.'); });
    </script>

    <!-- PWA: Регистрация Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker успешно зарегистрирован:', reg))
                    .catch((err) => console.error('Ошибка регистрации Service Worker:', err));
            });
        }
    </script>
</body>
</html>
