<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Моя Поэзия</title>
  <meta name="theme-color" content="#0f141d">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg-color:#0d0c0a;--surface:#171511;--surface-2:#201c15;--paper:#19160f;--paper-ink:#f1e7d2;--card-border:#49391f;--accent-gold:#d9b66d;--accent-strong:#f0d391;--text-primary:#f0eadf;--text-secondary:#b5a88f;--muted:#827660;--shadow:0 18px 45px rgba(0,0,0,.24);--font-serif:'Cormorant Garamond',Georgia,serif;--font-sans:'Inter',sans-serif}
    :root[data-theme="light"]{color-scheme:light;--bg-color:#f4efe5;--surface:#fffaf0;--surface-2:#f0e5cf;--paper:#fffaf0;--paper-ink:#352819;--card-border:#d8c69f;--accent-gold:#98702d;--accent-strong:#75501c;--text-primary:#30271d;--text-secondary:#77664d;--muted:#9b8b72;--shadow:0 18px 40px rgba(76,54,21,.10)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:radial-gradient(ellipse at top,#2a2114 0%,var(--bg-color) 48%);color:var(--text-primary);font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column;transition:background .25s,color .25s}
    :root[data-theme="light"] body{background:radial-gradient(ellipse at top,#fff9eb 0%,var(--bg-color) 56%)}
    header{padding:15px 20px;border-bottom:1px solid var(--card-border);background:color-mix(in srgb,var(--bg-color) 90%,transparent);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:11px}.brand:before{content:'✦';color:var(--accent-gold);font-size:24px}.brand h1{font-family:var(--font-serif);font-size:30px;font-weight:600;letter-spacing:.3px;color:var(--accent-gold)}
    .header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    button,select,input,textarea{font:inherit}button{cursor:pointer;transition:transform .15s,background .2s,border-color .2s}button:active{transform:translateY(1px)}
    .btn-add{background:linear-gradient(135deg,var(--accent-strong),var(--accent-gold));color:#171108;border:1px solid var(--accent-gold);padding:10px 15px;border-radius:7px;font-weight:600;box-shadow:0 4px 14px #0002}
    .btn-quiet{background:var(--surface);color:var(--text-primary);border:1px solid var(--card-border);padding:9px 12px;border-radius:7px}
    .theme-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:18px}
    main{padding:24px 18px 50px;max-width:1040px;margin:0 auto;width:100%}
    .library-heading{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:4px 0 22px;padding-bottom:15px;border-bottom:1px solid var(--card-border)}
    .library-heading h2{font-family:var(--font-serif);font-weight:600;font-size:clamp(28px,5vw,38px);color:var(--accent-gold)}.library-heading p{color:var(--text-secondary);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
    .search-bar input,.control{width:100%;background:var(--surface);border:1px solid var(--card-border);padding:12px 14px;border-radius:7px;color:var(--text-primary);outline:none;min-width:0}
    .search-bar input:focus,.control:focus,.modal-content input:focus,.modal-content textarea:focus{border-color:var(--accent-gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-gold) 17%,transparent)}
    .toolbar{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:9px;margin:0 0 12px}.toolbar .search-bar{grid-column:1/-1}
    .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.filter-row .control{flex:1;min-width:140px}.filter-btn.active{border-color:var(--accent-gold);color:var(--accent-gold)}
    #syncStatus{color:var(--text-secondary);font-size:11px;margin:0 0 18px;overflow-wrap:anywhere;opacity:.8}
    #adminPanel{display:none;background:var(--surface);border:1px solid var(--card-border);padding:14px;border-radius:8px;margin-bottom:18px}#adminPanel .admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    #poemsGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .poem-card{position:relative;isolation:isolate;min-height:265px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--card-border);padding:27px 25px 24px;cursor:pointer;box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s;overflow:hidden}
    .poem-card:before{content:'';position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--accent-gold) 42%,transparent);pointer-events:none;z-index:-1}
    .poem-card:after{content:'✦';position:absolute;bottom:13px;right:18px;color:var(--accent-gold);font-size:13px;opacity:.8}
    .poem-card:hover{transform:translateY(-3px);box-shadow:0 22px 50px #0003}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .poem-card h3{font-family:var(--font-serif);font-size:clamp(23px,3vw,29px);line-height:1.05;color:var(--accent-gold);overflow-wrap:anywhere;font-weight:600}
    .date{font-size:11px;letter-spacing:.8px;color:var(--text-secondary);margin:8px 0 17px;text-transform:uppercase}
    .preview{font-family:var(--font-serif);font-size:19px;line-height:1.5;color:var(--paper-ink);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;padding-left:12px;border-left:1px solid color-mix(in srgb,var(--accent-gold) 60%,transparent)}
    .category-pill{display:inline-block;font-size:11px;letter-spacing:.6px;color:var(--accent-gold);border:1px solid color-mix(in srgb,var(--accent-gold) 60%,transparent);padding:4px 9px;margin-top:15px;text-transform:uppercase}
    .star-btn{border:1px solid var(--card-border);background:var(--surface);color:var(--text-secondary);border-radius:50%;width:37px;height:37px;font-size:20px;flex-shrink:0}.star-btn.active{color:var(--accent-gold);border-color:var(--accent-gold)}
    .modal{display:none;position:fixed;inset:0;background:rgba(8,7,5,.82);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:14px}.modal.active{display:flex}
    .modal-content{background:var(--surface);border:1px solid var(--card-border);border-radius:3px;width:100%;max-width:560px;padding:24px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 90px #0006}
    .modal-content input,.modal-content textarea,.modal-content select{width:100%;background:var(--bg-color);border:1px solid var(--card-border);border-radius:5px;padding:12px;color:var(--text-primary);margin-top:8px;outline:none}
    .modal-content label{display:block;color:var(--text-secondary);font-size:12px;margin-top:12px}.modal-content textarea{font-family:var(--font-serif);font-size:20px;height:210px;line-height:1.5;resize:vertical}
    .actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.actions-right{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
    #readerContent{max-width:740px;background:var(--paper);color:var(--paper-ink);padding:clamp(26px,6vw,58px);border:1px solid var(--accent-gold);outline:1px solid color-mix(in srgb,var(--accent-gold) 50%,transparent);outline-offset:-8px;border-radius:2px}
    #viewTitle{font-family:var(--font-serif);font-size:clamp(32px,7vw,46px);font-weight:600;text-align:center;color:var(--accent-gold)!important;line-height:1.05}
    .view-text{font-family:var(--font-serif);font-size:22px;line-height:1.85;white-space:pre-wrap;margin-top:26px;overflow-wrap:anywhere;text-align:center;color:var(--paper-ink)}
    .view-meta{font-size:11px;letter-spacing:1px;color:var(--text-secondary);margin-top:12px;text-align:center;text-transform:uppercase}.reader-mode .modal-content{max-width:760px;padding:clamp(30px,7vw,70px)}.reader-mode #viewTitle{font-size:clamp(36px,7vw,52px)}.reader-mode .view-text{font-size:clamp(23px,4vw,30px);line-height:2;text-align:center;letter-spacing:.15px}.reader-mode .view-meta{text-align:center}
    .reader-tools{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:28px}.reader-tools .btn-quiet{padding:7px 10px}
    .empty-state{grid-column:1/-1;text-align:center;color:var(--text-secondary);margin-top:36px;line-height:1.8;padding:28px 16px;border:1px dashed var(--card-border);font-family:var(--font-serif);font-size:20px}
    .hidden{display:none!important}

    .count-heading{align-items:center;margin:4px 0 22px;padding:4px 0 18px}.count-heading h2{font-size:clamp(38px,9vw,56px);line-height:1;margin-top:4px}.count-heading .eyebrow{font-family:var(--font-sans);font-size:10px;letter-spacing:2px;color:var(--text-secondary);text-transform:uppercase}.count-ornament{color:var(--accent-gold);font-size:36px}.home-toolbar{display:block;margin-bottom:12px}.home-toolbar .search-bar input{border-radius:14px;padding:16px 18px;font-size:16px}.home-filters{margin-bottom:18px}.home-filters .btn-quiet{border-radius:12px;padding:11px 18px}.menu-content{max-width:520px;border-radius:12px}.menu-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.menu-section-title{font-family:var(--font-serif);font-size:23px;color:var(--accent-gold);margin:22px 0 8px}.menu-content label{display:block;color:var(--text-secondary);font-size:12px;margin:12px 0 6px}.menu-content select.control{margin:0}.menu-wide{width:100%;margin-top:12px;text-align:left}.menu-account{margin-top:18px;padding-top:14px;border-top:1px solid var(--card-border)}#adminPanel{margin-top:22px;margin-bottom:0}#adminPanel .admin-actions{display:grid;grid-template-columns:1fr}.menu-content .admin-actions button{text-align:left}.theme-btn{width:42px;height:42px;border-radius:50%;font-size:20px}.poem-card{border-radius:22px 22px 22px 22px}.poem-card:before{border-radius:15px}.search-bar input{border-radius:14px}

    @media(max-width:620px){header{padding:12px}.brand{gap:6px}.brand:before{font-size:19px}.brand h1{font-size:24px}.header-actions{gap:5px}.btn-add{padding:9px 10px;font-size:12px}.btn-quiet{padding:8px 9px}main{padding:20px 13px 35px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search-bar{grid-column:1/-1}#poemsGrid{grid-template-columns:1fr;gap:14px}.poem-card{min-height:230px;padding:25px 23px}.library-heading{margin-bottom:17px}.library-heading p{font-size:10px;letter-spacing:1px}.modal-content{padding:18px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>Моя Поэзия</h1></div>
    <div class="header-actions">
      <button id="themeToggle" class="btn-quiet theme-btn" onclick="toggleTheme()" aria-label="Переключить тему" title="Переключить тему">☼</button>
      <button id="menuBtn" class="btn-quiet theme-btn" onclick="openMenu()" aria-label="Открыть меню" title="Меню">☰</button>
      <button id="loginBtn" class="btn-add" onclick="login()">Войти</button>
      <button id="logoutBtn" class="btn-quiet hidden" onclick="logout()">Выйти</button>
      <button id="addBtn" class="btn-add hidden" onclick="openEditModal()">+ Стих</button>
    </div>
  </header>
  <main>
    <div class="library-heading count-heading"><div><p class="eyebrow">ВАША ПОЭТИЧЕСКАЯ КОЛЛЕКЦИЯ</p><h2><span id="poemCount">0</span> <span id="poemCountLabel">стихов</span></h2></div><span aria-hidden="true" class="count-ornament">❧</span></div>
    <div class="toolbar home-toolbar">
      <div class="search-bar"><input type="search" id="searchInput" placeholder="Найти стихотворение…" oninput="render()" aria-label="Поиск стихов"></div>
    </div>
    <div class="filter-row home-filters">
      <button id="favoritesFilter" class="btn-quiet filter-btn" onclick="toggleFavoritesFilter()">☆ Избранное</button>
    </div>
    <div id="syncStatus" role="status" aria-live="polite">Подключение к библиотеке…</div>
    <section id="adminPanel">
      <p style="font-size:12px;color:var(--text-secondary)">Режим администратора · <span id="adminUid"></span></p>
      <div class="admin-actions">
        <button class="btn-quiet" onclick="importLocal()">Перенести старые стихи</button>
        <button class="btn-quiet" onclick="exportBackup()">Экспорт / резервная копия</button>
        <button class="btn-quiet" onclick="document.getElementById('backupFile').click()">Восстановить из JSON</button>
        <input class="hidden" type="file" id="backupFile" accept="application/json,.json" onchange="importBackup(event)">
      </div>
    </section>
    <div id="poemsGrid"></div>
  </main>

  <div class="modal" id="menuModal" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="modal-content menu-content">
      <div class="menu-heading"><h2 id="menuTitle" style="color:var(--accent-gold);font-family:var(--font-serif)">Меню библиотеки</h2><button class="btn-quiet" onclick="closeModal('menuModal')" aria-label="Закрыть меню">✕</button></div>
      <h3 class="menu-section-title">Фильтры и сортировка</h3>
      <label for="categoryFilter">Категория</label><select class="control" id="categoryFilter" aria-label="Фильтр по категории" onchange="render()"><option value="">Все категории</option></select>
      <label for="sortSelect">Сортировка</label><select class="control" id="sortSelect" aria-label="Сортировка" onchange="render()"><option value="newest">Сначала новые</option><option value="oldest">Сначала старые</option><option value="title">По названию А–Я</option></select>
      <button class="btn-quiet menu-wide" onclick="clearFilters()">Сбросить фильтры</button>
      <section id="adminPanel">
        <h3 class="menu-section-title">Инструменты администратора</h3>
        <p style="font-size:12px;color:var(--text-secondary)">Режим администратора · <span id="adminUid"></span></p>
        <div class="admin-actions">
          <button class="btn-quiet" onclick="importLocal()">Перенести старые стихи</button>
          <button class="btn-quiet" onclick="exportBackup()">Экспорт / резервная копия</button>
          <button class="btn-quiet" onclick="document.getElementById('backupFile').click()">Восстановить из JSON</button>
          <input class="hidden" type="file" id="backupFile" accept="application/json,.json" onchange="importBackup(event)">
        </div>
      </section>
      <div class="menu-account"><button id="menuLoginBtn" class="btn-add" onclick="closeModal('menuModal');login()">Войти через Google</button><button id="menuLogoutBtn" class="btn-quiet hidden" onclick="closeModal('menuModal');logout()">Выйти из аккаунта</button></div>
    </div>
  </div>

  <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <h2 id="modalTitle" style="color:var(--accent-gold);font-family:var(--font-serif)">Новый стих</h2>
      <input type="hidden" id="poemId">
      <label for="titleInput">Название</label><input id="titleInput" type="text" maxlength="180" placeholder="Название стихотворения">
      <label for="categoryInput">Категория</label><input id="categoryInput" type="text" maxlength="60" list="categorySuggestions" placeholder="Например: Любовь, Жизнь, Грусть">
      <datalist id="categorySuggestions"><option value="Любовь"><option value="Жизнь"><option value="Грусть"><option value="Вдохновение"><option value="Природа"><option value="Дружба"></datalist>
      <label for="bodyInput">Текст стихотворения</label><textarea id="bodyInput" placeholder="Текст стихотворения…"></textarea>
      <div class="actions">
        <button id="deleteBtn" onclick="removePoem()" style="background:transparent;color:#ef4444;border:none;display:none">Удалить</button>
        <div class="actions-right"><button class="btn-quiet" onclick="closeModal('editModal')">Отмена</button><button class="btn-add" onclick="save()">Сохранить</button></div>
      </div>
    </div>
  </div>

  <div class="modal" id="viewModal" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
    <div class="modal-content" id="readerContent">
      <h2 id="viewTitle" style="color:var(--accent-gold);font-family:var(--font-serif)"></h2>
      <div id="viewDate" class="view-meta"></div>
      <div id="viewCategory" class="category-pill hidden"></div>
      <div id="viewBody" class="view-text"></div>
      <div class="reader-tools">
        <button id="viewFavoriteBtn" class="btn-quiet" onclick="toggleCurrentFavorite()">☆ В избранное</button>
        <button id="readerModeBtn" class="btn-quiet" onclick="toggleReaderMode()">✧ Режим чтения</button>
        <button class="btn-quiet" onclick="changeReaderSize(-1)" aria-label="Уменьшить текст">A−</button>
        <button class="btn-quiet" onclick="changeReaderSize(1)" aria-label="Увеличить текст">A+</button>
      </div>
      <div class="actions">
        <button class="btn-quiet" onclick="closeModal('viewModal')">Закрыть</button>
        <button id="editCurrentBtn" onclick="editCurrent()" class="btn-add hidden">Изменить</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyBjcUXcG0MfND7G14UoGVYH8G1xuaeZoPg',
      authDomain: 'marufs-poetry.firebaseapp.com',
      projectId: 'marufs-poetry',
      storageBucket: 'marufs-poetry.firebasestorage.app',
      messagingSenderId: '213962256080',
      appId: '1:213962256080:web:39afdd3835e6d6201238d5',
      measurementId: 'G-JLQ7NYL03C'
    };
    const ADMIN_UID = 'GgKTFgrTyKUUtxZwL8QEy4BlCRs1';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const poemsRef = collection(db, 'poems');
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    let poems = [], favorites = new Set(), currentActiveId = null, admin = false, currentUser = null;
    let favoritesUnsubscribe = null, poemsUnsubscribe = null, favoritesOnly = false, readerFontSize = 21;
    const status = message => { $('syncStatus').textContent = message; };
    const THEME_KEY = 'moja-poeziya-theme';
    function applyTheme(theme) {
      const selected = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = selected;
      $('themeToggle').textContent = selected === 'dark' ? '☼' : '☾';
      $('themeToggle').title = selected === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему';
      $('themeToggle').setAttribute('aria-label', $('themeToggle').title);
      document.querySelector('meta[name="theme-color"]').content = selected === 'dark' ? '#0d0c0a' : '#f4efe5';
    }
    window.openMenu = function() { $('menuModal').classList.add('active'); };
    window.toggleTheme = function() {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
      applyTheme(next);
    };
    let savedTheme = 'dark';
    try { savedTheme = localStorage.getItem(THEME_KEY) || 'dark'; } catch (_) {}
    applyTheme(savedTheme);
    const favoriteRef = (uid, poemId) => doc(db, 'users', uid, 'favorites', poemId);

    function categoryOf(p) { return String(p.category || '').trim(); }
    function refreshCategoryFilter() {
      const select = $('categoryFilter'), previous = select.value;
      const categories = [...new Set(poems.map(categoryOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
      select.innerHTML = '<option value="">Все категории</option>' + categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      if (categories.includes(previous)) select.value = previous;
    }
    function render() {
      $('poemCount').textContent = poems.length.toLocaleString('ru-RU');
      $('poemCountLabel').textContent = poems.length % 10 === 1 && poems.length % 100 !== 11 ? 'стихотворение' : ([2,3,4].includes(poems.length % 10) && ![12,13,14].includes(poems.length % 100) ? 'стихотворения' : 'стихов');
      const q = $('searchInput').value.trim().toLocaleLowerCase('ru');
      const category = $('categoryFilter').value;
      const sort = $('sortSelect').value;
      let filtered = poems.filter(p => {
        const haystack = [p.title, p.body, p.category].map(x=>String(x||'').toLocaleLowerCase('ru')).join('\n');
        return (!q || haystack.includes(q)) && (!category || categoryOf(p) === category) && (!favoritesOnly || favorites.has(p.id));
      });
      filtered.sort((a,b) => sort === 'title' ? String(a.title||'').localeCompare(String(b.title||''),'ru') : sort === 'oldest' ? (a.updatedAt||0)-(b.updatedAt||0) : (b.updatedAt||0)-(a.updatedAt||0));
      $('poemsGrid').innerHTML = filtered.length ? filtered.map(p => `
        <article class="poem-card" data-poem-id="${escapeHtml(p.id)}" tabindex="0" role="button" aria-label="Открыть стих ${escapeHtml(p.title||'Без названия')}">
          <div class="card-top"><div><h3>${escapeHtml(p.title||'Без названия')}</h3><div class="date">${escapeHtml(p.date||'')}</div></div>
            <button class="star-btn ${favorites.has(p.id)?'active':''}" data-favorite-id="${escapeHtml(p.id)}" aria-label="${favorites.has(p.id)?'Убрать из избранного':'Добавить в избранное'}" title="Избранное">${favorites.has(p.id)?'★':'☆'}</button>
          </div>
          <div class="preview">${escapeHtml(p.body||'')}</div>
          ${categoryOf(p)?`<span class="category-pill">${escapeHtml(categoryOf(p))}</span>`:''}
        </article>`).join('') : '<div class="empty-state">Стихи не найдены.<br>Попробуй изменить запрос или сбросить фильтры.</div>';
    }
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { ['menuModal','editModal','viewModal'].forEach(id => closeModal(id)); } });
    $('poemsGrid').addEventListener('click', event => {
      const favoriteButton = event.target.closest('[data-favorite-id]');
      if (favoriteButton) { event.stopPropagation(); toggleFavorite(favoriteButton.dataset.favoriteId); return; }
      const card = event.target.closest('[data-poem-id]'); if (card) viewPoem(card.dataset.poemId);
    });
    $('poemsGrid').addEventListener('keydown', event => { if ((event.key==='Enter'||event.key===' ') && event.target.matches('[data-poem-id]')) { event.preventDefault(); viewPoem(event.target.dataset.poemId); } });

    window.openEditModal = function(id=null) {
      if (!admin) return;
      const p = id ? poems.find(x=>x.id===id) : null; currentActiveId = id;
      $('poemId').value = p?.id || ''; $('titleInput').value = p?.title || ''; $('categoryInput').value = p?.category || ''; $('bodyInput').value = p?.body || '';
      $('modalTitle').textContent = p ? 'Редактировать стих' : 'Новый стих'; $('deleteBtn').style.display = p ? 'block' : 'none';
      closeModal('viewModal'); $('editModal').classList.add('active');
    };
    function viewPoem(id) {
      const p = poems.find(x=>x.id===id); if (!p) return; currentActiveId=id;
      $('viewTitle').textContent=p.title||'Без названия'; $('viewDate').textContent=p.date||''; $('viewBody').textContent=p.body||'';
      $('viewCategory').textContent=categoryOf(p); $('viewCategory').classList.toggle('hidden',!categoryOf(p));
      $('editCurrentBtn').classList.toggle('hidden',!admin); updateCurrentFavoriteButton(); $('viewModal').classList.add('active');
    }
    window.editCurrent = () => { if(admin && currentActiveId) openEditModal(currentActiveId); };
    window.closeModal = id => { $(id).classList.remove('active'); document.body.classList.remove('reader-mode'); };
    window.save = async function() {
      if (!admin) return;
      const id=$('poemId').value || crypto.randomUUID(), title=$('titleInput').value.trim()||'Без названия', body=$('bodyInput').value.trim(), category=$('categoryInput').value.trim();
      if (!body) return alert('Введите текст стихотворения.');
      const previous=poems.find(p=>p.id===id);
      try { await setDoc(doc(db,'poems',id),{title,body,category,date:previous?.date||new Date().toLocaleDateString('ru-RU'),updatedAt:Date.now()}); closeModal('editModal'); }
      catch(e) { alert('Не удалось сохранить стих: '+e.message); }
    };
    window.removePoem = async function() {
      if(!admin||!currentActiveId||!confirm('Удалить этот стих?')) return;
      try { await deleteDoc(doc(db,'poems',currentActiveId)); closeModal('editModal'); }
      catch(e) { alert('Не удалось удалить стих: '+e.message); }
    };
    window.toggleFavorite = async function(id) {
      if(!currentUser) { alert('Войди через Google, чтобы синхронизировать избранное между устройствами.'); return; }
      const ref=favoriteRef(currentUser.uid,id);
      try { if(favorites.has(id)) await deleteDoc(ref); else await setDoc(ref,{poemId:id,createdAt:Date.now()}); }
      catch(e) { alert('Не удалось обновить избранное: '+e.message+'. Проверь правила Firestore.'); }
    };
    window.toggleCurrentFavorite = () => { if(currentActiveId) toggleFavorite(currentActiveId); };
    function updateCurrentFavoriteButton() { const active=favorites.has(currentActiveId); $('viewFavoriteBtn').textContent=active?'★ В избранном':'☆ В избранное'; $('viewFavoriteBtn').classList.toggle('filter-btn',active); }
    window.toggleFavoritesFilter = function() { favoritesOnly=!favoritesOnly; $('favoritesFilter').classList.toggle('active',favoritesOnly); $('favoritesFilter').textContent=favoritesOnly?'★ Только избранное':'☆ Избранное'; render(); };
    window.clearFilters = function() { $('searchInput').value=''; $('categoryFilter').value=''; $('sortSelect').value='newest'; favoritesOnly=false; $('favoritesFilter').classList.remove('active'); $('favoritesFilter').textContent='☆ Избранное'; render(); };
    window.toggleReaderMode = function() { document.body.classList.toggle('reader-mode'); $('readerModeBtn').textContent=document.body.classList.contains('reader-mode')?'✧ Обычный режим':'✧ Режим чтения'; };
    window.changeReaderSize = function(delta) { readerFontSize=Math.max(16,Math.min(34,readerFontSize+delta*2)); $('viewBody').style.fontSize=readerFontSize+'px'; };

    window.exportBackup = async function() {
      if(!admin) return alert('Экспорт доступен только администратору.');
      try {
        const backup={format:'moja-poeziya-backup',version:1,exportedAt:new Date().toISOString(),projectId:firebaseConfig.projectId,poems:poems.map(({id,title,body,date,category,updatedAt})=>({id,title,body,date,category:category||'',updatedAt:updatedAt||0}))};
        const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=url; a.download='moja-poeziya-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        alert('Резервная копия подготовлена. Сохрани файл в надёжном месте.');
      } catch(e) { alert('Не удалось создать резервную копию: '+e.message); }
    };
    window.importBackup = async function(event) {
      const file=event.target.files?.[0]; event.target.value=''; if(!file) return;
      if(!admin) return alert('Восстановление доступно только администратору.');
      if(file.size>10*1024*1024) return alert('Файл слишком большой (максимум 10 МБ).');
      let data; try { data=JSON.parse(await file.text()); } catch { return alert('Файл не является корректным JSON.'); }
      if(data?.format!=='moja-poeziya-backup'||!Array.isArray(data.poems)) return alert('Неподходящий файл резервной копии. Выбери JSON, созданный этим приложением.');
      const valid=data.poems.filter(p=>p&&typeof p.id==='string'&&p.id.length>0&&typeof p.body==='string').slice(0,400);
      if(!valid.length) return alert('В резервной копии нет корректных стихов.');
      if(!confirm(`Восстановить ${valid.length} стихов? Документы с совпадающими ID будут перезаписаны; остальные не удалятся.`)) return;
      try {
        for(let i=0;i<valid.length;i+=400) {
          const batch=writeBatch(db);
          for(const p of valid.slice(i,i+400)) batch.set(doc(db,'poems',p.id),{title:String(p.title||'Без названия').slice(0,180),body:p.body,category:String(p.category||'').slice(0,60),date:String(p.date||''),updatedAt:Number(p.updatedAt)||Date.now()});
          await batch.commit();
        }
        alert(`Восстановлено стихов: ${valid.length}. Существующие документы с теми же ID обновлены.`);
      } catch(e) { alert('Ошибка восстановления: '+e.message); }
    };
    window.importLocal = async function() {
      if(!admin) return;
      let local; try { local=JSON.parse(localStorage.getItem('my_poems')||'[]'); } catch { return alert('Ошибка чтения локальных стихов.'); }
      if(!Array.isArray(local)||!local.length) return alert('На этом устройстве нет локальных стихов.');
      if(!confirm(`Перенести ${local.length} локальных стихов в облако? Локальные данные останутся на устройстве.`)) return;
      let count=0;
      for(const p of local) { if(!p||typeof p.body!=='string') continue; const id='legacy-'+String(p.id??crypto.randomUUID()).replace(/[^a-zA-Z0-9_-]/g,'_');
        try { await setDoc(doc(db,'poems',id),{title:String(p.title||'Без названия'),body:p.body,category:String(p.category||''),date:String(p.date||''),updatedAt:Date.now()}); count++; }
        catch(e) { alert(`Перенесено ${count}. Ошибка: ${e.message}`); return; }
      }
      alert(`Перенесено стихов: ${count}. Локальные копии сохранены.`);
    };
    window.login = async function() { const provider=new GoogleAuthProvider(); try { await signInWithPopup(auth,provider); } catch(e) { if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) { try { await signInWithRedirect(auth,provider); } catch(err) { alert('Ошибка входа: '+err.message); } } else alert('Ошибка входа: '+e.message); } };
    window.logout = () => signOut(auth);
    getRedirectResult(auth).catch(e=>console.warn('Google redirect:',e));

    onAuthStateChanged(auth,user=>{
      currentUser=user; admin=!!user&&user.uid===ADMIN_UID;
      $('loginBtn').classList.toggle('hidden',!!user); $('logoutBtn').classList.toggle('hidden',!user); $('addBtn').classList.toggle('hidden',!admin); $('menuLoginBtn').classList.toggle('hidden',!!user); $('menuLogoutBtn').classList.toggle('hidden',!user); $('adminPanel').style.display=admin?'block':'none'; $('adminUid').textContent=admin?user.uid:'';
      if(favoritesUnsubscribe) { favoritesUnsubscribe(); favoritesUnsubscribe=null; }
      favorites=new Set(); render();
      if(user) {
        favoritesUnsubscribe=onSnapshot(collection(db,'users',user.uid,'favorites'),snap=>{favorites=new Set(snap.docs.map(d=>d.id)); render(); updateCurrentFavoriteButtonIfOpen();},err=>{console.error(err);status('Избранное недоступно: '+err.message);});
        if(!admin) status('Вход выполнен. Чтение доступно; права администратора не назначены этому аккаунту.');
      } else { status('Вы вошли как гость. Войдите через Google для синхронизации избранного.'); }
    });
    function updateCurrentFavoriteButtonIfOpen(){ if($('viewModal').classList.contains('active')) updateCurrentFavoriteButton(); }
    poemsUnsubscribe=onSnapshot(poemsRef,snapshot=>{
      poems=snapshot.docs.map(d=>({id:d.id,...d.data()})); refreshCategoryFilter(); render();
      status(snapshot.metadata.fromCache?'Офлайн: показана сохранённая копия':'Библиотека синхронизирована с Firebase');
    },error=>{ console.error(error); status('Ошибка загрузки стихов: '+error.message+'. Проверь Firestore Rules и подключение.'); });

    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.error('Service Worker:',err)));
  </script>
</body>
</html>
